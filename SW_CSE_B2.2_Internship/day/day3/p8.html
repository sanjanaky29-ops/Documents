<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tag</title>
</head>
<body>
    <p>Video Tag example</p>
    <video src="../video/sampleVideo.mp4" controls "></video>

    <!-- width & height -->
     <video src="../video/samplevideo.mp4" controls  width="640" height="360"></video>

     <!-- autoplay -->
     <video src="sampleVideo.mp4" controls  autoplay></video>

     <!-- Muted -->
    <video src="../video/sampleVideo.mp4" controls autoplay muted width="640" height="360"></video>

    <!-- loop -->
    <video src="../video/sampleVideo.mp4" controls loop autoplay muted width="640" height="360"></video>
!-- poster -->
     <video src="../video/sampleVideo.mp4" controls  poster="../day2/dog image.jpg"></video>
</body>
</html>
